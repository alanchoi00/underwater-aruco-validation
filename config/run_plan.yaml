# Run plan for underwater ArUco detection captures.
# Consumed by run_recorder.py. range_m is the PLANNED tape range (null = operator-set).
# dwell_s is a suggested minimum; actual duration is operator-controlled (ENTER to stop).
runs:
  - {id: S1, target: calibration,    range_m: null, yaw_deg: 0,  pitch_deg: 0,  dwell_s: 60, priority: core,       notes: "in-water calib board, >=20 varied poses"}
  - {id: S2, target: dock,           range_m: 1.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 30, priority: core,       notes: "baseline turbidity frames (Turbidivision)"}

  - {id: A1, target: dock,           range_m: 0.5,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: core,       notes: ""}
  - {id: A2, target: dock,           range_m: 1.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: core,       notes: ""}
  - {id: A3, target: dock,           range_m: 1.5,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: core,       notes: ""}
  - {id: A4, target: dock,           range_m: 2.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: core,       notes: ""}
  - {id: A5, target: dock,           range_m: 2.5,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: core,       notes: ""}
  - {id: A6, target: dock,           range_m: 3.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: core,       notes: ""}
  - {id: A7, target: dock,           range_m: 4.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: core,       notes: ""}
  - {id: A8, target: dock,           range_m: 5.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: core,       notes: "extend if 200mm still detects"}

  - {id: B1, target: dock,           range_m: 1.0,  yaw_deg: 20, pitch_deg: 0,  dwell_s: 45, priority: core,       notes: ""}
  - {id: B2, target: dock,           range_m: 2.0,  yaw_deg: 20, pitch_deg: 0,  dwell_s: 45, priority: core,       notes: ""}
  - {id: B3, target: dock,           range_m: 3.0,  yaw_deg: 20, pitch_deg: 0,  dwell_s: 45, priority: core,       notes: ""}

  - {id: C1, target: dock,           range_m: 1.0,  yaw_deg: 40, pitch_deg: 0,  dwell_s: 45, priority: core,       notes: ""}
  - {id: C2, target: dock,           range_m: 2.0,  yaw_deg: 40, pitch_deg: 0,  dwell_s: 45, priority: core,       notes: ""}
  - {id: C3, target: dock,           range_m: 3.0,  yaw_deg: 40, pitch_deg: 0,  dwell_s: 45, priority: core,       notes: "watch for pose flips"}

  - {id: D1, target: dock,           range_m: 1.5,  yaw_deg: 0,  pitch_deg: 20, dwell_s: 45, priority: optional,   notes: ""}
  - {id: D2, target: dock,           range_m: 2.5,  yaw_deg: 0,  pitch_deg: 20, dwell_s: 45, priority: optional,   notes: ""}

  - {id: E1, target: compare_board,  range_m: 1.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: comparison, notes: "4x4/5x5/6x6/AprilTag board"}
  - {id: E2, target: compare_board,  range_m: 2.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: comparison, notes: ""}
  - {id: E3, target: compare_board,  range_m: 3.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: comparison, notes: ""}
  - {id: E4, target: compare_board,  range_m: 4.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: comparison, notes: ""}

  - {id: F1, target: dock,           range_m: null, yaw_deg: 0,  pitch_deg: 0,  dwell_s: 60, priority: optional,   notes: "continuous approach ~5.0 -> 0.3 m; stop manually"}
  - {id: F2, target: dock,           range_m: 1.5,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: optional,   notes: "partial occlusion test"}
  - {id: F3, target: dock,           range_m: 2.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: optional,   notes: "alternate lighting"}

  - {id: G1, target: dock,           range_m: 1.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: core,       notes: "repeat of A2"}
  - {id: G2, target: dock,           range_m: 1.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: core,       notes: "repeat of A2"}
  - {id: G3, target: dock,           range_m: 2.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: core,       notes: "repeat of A4"}
  - {id: G4, target: dock,           range_m: 2.0,  yaw_deg: 0,  pitch_deg: 0,  dwell_s: 45, priority: core,       notes: "repeat of A4"}
